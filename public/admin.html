<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Painel Admin & Recepção • SAVE Match (Boate Save)</title>
  <meta name="description" content="Painel de controle oficial da Boate Save: gerencie check-ins da noite, eventos, avisos em tempo real e estatísticas da pista." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="SAVE Match • Boate Save" />
  <meta property="og:title" content="Painel Admin & Recepção • SAVE Match (Boate Save)" />
  <meta property="og:description" content="Painel de controle oficial da Boate Save: gerencie check-ins da noite, eventos, avisos em tempo real e estatísticas da pista." />
  <meta property="og:image" content="https://res.cloudinary.com/hs28bxgs/image/upload/c_fill,f_jpg,h_630,q_85,w_1200/v1794432272/save-match/brand/og-cover-v2.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <link rel="icon" href="/img/icon-512.png" type="image/png" sizes="512x512" />
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --purple: #670083;
      --yellow: #E8B432;
      --blue: #35ACE8;
      --magenta: #c501e2;
      --green: #2ef8a0;
      --pink: #f82d97;
      --bg: #09040e;
      --bg2: #12081c;
      --card: #180c26;
      --card2: #211234;
      --line: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --muted: #a695b8;
      --grad: linear-gradient(135deg, var(--magenta), var(--pink) 55%, #FF5B00);
      --radius: 16px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: var(--green); text-decoration: none; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; }
    
    /* Layout */
    .admin-nav {
      background: rgba(18, 8, 28, 0.95);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-wrap img { height: 36px; }
    .badge-admin {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: var(--grad);
      padding: 3px 8px;
      border-radius: 99px;
    }
    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }
    .tab-btn {
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
    .tab-btn.active {
      color: #fff;
      background: var(--card2);
      border: 1px solid var(--line);
      box-shadow: 0 4px 12px rgba(197, 1, 226, 0.2);
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px;
      width: 100%;
      flex: 1;
    }
    
    /* Grid de estatísticas */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 20px;
      position: relative;
      overflow: hidden;
    }
    .stat-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--pink);
    }
    .stat-card.green::after { background: var(--green); }
    .stat-card.blue::after { background: var(--blue); }
    .stat-card.yellow::after { background: var(--yellow); }
    .stat-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .stat-num {
      font-size: 32px;
      font-weight: 800;
      line-height: 1;
    }
    .stat-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* Cards e painéis */
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .panel-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    /* Formulários e botões */
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .field label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
    }
    .input, select.input, textarea.input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }
    .input:focus { border-color: var(--magenta); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--grad); color: #fff; box-shadow: 0 4px 16px rgba(248, 45, 151, 0.3); }
    .btn-green { background: var(--green); color: #041208; }
    .btn-ghost { background: rgba(255,255,255,0.06); border: 1px solid var(--line); }
    .btn-danger { background: rgba(255, 60, 90, 0.15); color: #ff6b8b; border: 1px solid rgba(255, 60, 90, 0.3); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }

    /* Tabelas */
    .table-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }
    th {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
    }
    td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    /* Badges */
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
    }
    .tag-green { background: rgba(46, 248, 160, 0.15); color: var(--green); }
    .tag-yellow { background: rgba(232, 180, 50, 0.15); color: var(--yellow); }
    .tag-pink { background: rgba(248, 45, 151, 0.15); color: var(--pink); }
    .tag-blue { background: rgba(53, 172, 232, 0.15); color: var(--blue); }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-card {
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
      max-width: 520px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      display: inline-block;
      box-shadow: 0 0 10px var(--green);
    }
  </style>
</head>
<body>
  <!-- Cabeçalho -->
  <nav class="admin-nav">
    <div class="nav-inner">
      <div class="brand-wrap">
        <img src="/img/logo-white.svg" alt="Boate Save" />
        <span class="badge-admin">Painel da Equipe</span>
        <span style="font-size:12px;color:var(--muted);"><span class="pulse-dot"></span> Tempo Real</span>
      </div>
      <div class="tabs" id="tabs-bar">
        <button class="tab-btn active" data-tab="dashboard">📊 Visão Geral</button>
        <button class="tab-btn" data-tab="checkin">📍 QR Portaria</button>
        <button class="tab-btn" data-tab="vip">🎟️ Portaria VIP</button>
        <button class="tab-btn" data-tab="avisos">📣 Avisos na Pista</button>
        <button class="tab-btn" data-tab="agenda">🗓️ Agenda</button>
        <button class="tab-btn" data-tab="usuarios">👥 Pista & Moderação</button>
        <button class="tab-btn" data-tab="config">⚙️ Configurações</button>
      </div>
      <div>
        <a href="/" target="_blank" class="btn btn-ghost btn-sm">📱 Abrir App Cliente</a>
        <button id="btn-logout" class="btn btn-danger btn-sm" style="margin-left:6px;">Sair</button>
      </div>
    </div>
  </nav>

  <!-- Conteúdo Principal -->
  <main class="container" id="admin-view">
    <!-- Renderizado dinamicamente pelo JavaScript -->
  </main>

  <!-- Login Modal caso não autenticado -->
  <div id="login-modal" class="modal-backdrop" style="display:none;">
    <div class="modal-card" style="text-align:center;">
      <img src="/img/logo.svg" style="width:110px;margin:0 auto 16px;" alt="" />
      <h2 style="margin:0 0 8px;">Acesso Restrito • Boate Save</h2>
      <p style="color:var(--muted);font-size:14px;margin-bottom:20px;">Digite a senha de administrador da equipe para gerenciar o app.</p>
      <form id="form-login">
        <div class="field">
          <input type="password" id="login-pass" class="input" placeholder="Senha do painel (padrão: save2026)" required style="text-align:center;font-size:16px;" />
        </div>
        <div id="login-err" style="color:#ff6b8b;font-size:13px;min-height:20px;margin-bottom:10px;"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Entrar no Painel</button>
      </form>
    </div>
  </div>

  <div id="custom-modal-root"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
